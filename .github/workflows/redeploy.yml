name: Refresh
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "0 * * * *"
env:
  UPSUN_CLI_TOKEN: ${{ secrets.PLATFORMSH_CLI_TOKEN }}
  PLATFORM_PROJECT_ID: ${{ secrets.PLATFORM_PROJECT_ID }}
jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Install Upsun CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/upsun/cli/main/installer.sh | bash
          upsun project:set-remote ${{ secrets.PLATFORM_PROJECT_ID }}

      - name: Load certificate
        run: upsun ssh-cert:load --no-interaction

      - name: Add Psh to trusted keys
        continue-on-error: true
        run: |
          for ip in $(dig @8.8.8.8 git.us-2.platform.sh git.us.platform.sh git.us-4.platform.sh +short); do \
            ssh-keyscan git.us.platform.sh, git.us-2.platform.sh, git.us-4.platform.sh,$ip; \
            ssh-keyscan $ip; \
          done 2>/dev/null >> ~/.ssh/known_hosts
          cat ~/.ssh/known_hosts
      - run: upsun redeploy -y
